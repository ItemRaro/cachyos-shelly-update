# mypy configuration, used by CI (pinned in requirements-dev.txt).
# The package is checked strictly: every function typed, no implicit Any.
# The tests are type-checked too (bodies included), without requiring
# annotations on every test method.
[mypy]
python_version = 3.14
mypy_path = src
files = src/shellyupdate, tests/test_units.py, tests/tray_smoke.py
strict = True
warn_unreachable = True

[mypy-test_units,tray_smoke]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True
