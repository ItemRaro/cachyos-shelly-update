# ruff configuration, used by CI (pinned in requirements-dev.txt).
# Rules are listed explicitly so new ruff releases can't change them:
#   E4, E7, E9  pycodestyle errors: bad imports, statements, syntax/IO errors
#   F           pyflakes: unused imports/variables, undefined names, ...
#   B           flake8-bugbear: likely bugs (late-binding closures, ...)
#   UP          pyupgrade: modern syntax for the target Python
#   SIM, RET    simpler code: context managers, suppress, needless else/return
#   C4, PIE     comprehensions and small redundancies
#   PERF        performance anti-patterns (the timer runs the CLI hourly)
#   RUF         ruff's own checks (mutable defaults, ambiguous characters, ...)
# No naming rules (N): the project uses camelCase on purpose. No formatter:
# the code keeps its own column alignment.
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RET", "C4", "PIE", "PERF", "RUF"]
