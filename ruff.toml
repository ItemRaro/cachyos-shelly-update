# ruff configuration, used by CI (pinned ruff version in .gitlab-ci.yml).
# Rules are listed explicitly so new ruff releases can't change them:
#   E4, E7, E9  pycodestyle errors: bad imports, statements, syntax/IO errors
#   F           pyflakes: unused imports/variables, undefined names, ...
#   B           flake8-bugbear: likely bugs (late-binding closures, ...)
target-version = "py314"
# The launcher has no .py extension
extend-include = ["src/cachyos-shelly-update"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
